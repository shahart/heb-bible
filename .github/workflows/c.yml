name: C

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Compile App
      working-directory: ./c
      run: make

    - name: Run Tests
      working-directory: ./c
      run: make test
